[project]
name = "elevance-poc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "manemsai", email = "manemmohan.217@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.79",
    "duckdb>=1.5.5",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "ijson>=3.5.1",
    "langchain>=1.3.17",
    "langchain-aws>=1.7.3",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "lxml>=6.1.2",
    "mcp>=1.29.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
elevance-poc = "elevance_ai.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
