name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install pytest pytest-asyncio ruff mypy
      - run: pytest tests/unit tests/integration tests/evaluation
        env:
          PYTHONPATH: .
      - run: ruff check src apps scripts tests
